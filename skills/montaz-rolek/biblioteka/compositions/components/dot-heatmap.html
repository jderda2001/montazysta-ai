<!doctype html>
<!--
  dot-heatmap: siatka kropek, ktore zapalaja sie po kolei (dni, godziny, powtorzenia), z licznikiem

  Wlasny szablon biblioteki montaz-rolek (18.11.2026). Wzor: mapy aktywnosci z kropek w bibliotekach UI.
  Tu kropki zapalaja sie w ustalonej kolejnosci na osi czasu GSAP.

  Podpis i duzy licznik nad siatka cols x rows. Kropki zapalaja sie kolejno (wierszami albo fala po przekatnej),
  licznik pokazuje, ile juz sie pali. Do "codziennie przez 30 dni", "24/7", "100 rozmow", serii bez przerwy.
  Wzorem (pattern) mozna zostawic dziury, np. dni bez dzialania.

  Zmienne:
    - label (string, ""): podpis nad licznikiem.
    - cols, rows (number, 7 i 5): rozmiar siatki (do 24 x 12).
    - active (number, -1): ile kropek sie zapala; -1 = wszystkie. Pomijane, gdy podany pattern.
    - pattern (string, ""): ciag zer i jedynek wierszami ("1101..."); 1 = zapal. Inne znaki sa pomijane.
    - suffix (string, ""): tekst za licznikiem (np. "dni").
    - total (hide | show, "hide"): dopisuje "/ liczba wszystkich kropek".
    - order (rows | wave, "rows"): kolejnosc zapalania.
    - fill_at (number, 0.7), fill (number, 2.2): start i czas zapalania w sekundach.
    - backdrop (solid | none, "solid").

  Czas: wejscie 0,6 s, zapalanie od fill_at przez fill, reszta to przytrzymanie.
  Dzwiek (sfx.py): "shh" od fill_at z dl = fill albo 3-4 "tik" rozlozone w czasie zapalania; "pop" na koncu.
-->
<html
  lang="pl"
  data-composition-id="dot-heatmap"
  data-composition-duration="4.5"
  data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Podpis", "description": "Podpis nad licznikiem.", "default": "" },
    { "id": "cols", "type": "number", "role": "content", "label": "Kolumny", "description": "Liczba kolumn (do 24).", "default": 7 },
    { "id": "rows", "type": "number", "role": "content", "label": "Wiersze", "description": "Liczba wierszy (do 12).", "default": 5 },
    { "id": "active", "type": "number", "role": "content", "label": "Zapalone", "description": "Ile kropek sie zapala; -1 = wszystkie.", "default": -1 },
    { "id": "pattern", "type": "string", "role": "content", "label": "Wzor", "description": "Zera i jedynki wierszami; 1 = zapal.", "default": "" },
    { "id": "suffix", "type": "string", "role": "content", "label": "Za licznikiem", "description": "Tekst za licznikiem.", "default": "" },
    { "id": "total", "type": "enum", "role": "content", "label": "Suma", "description": "Pokaz liczbe wszystkich kropek.", "default": "hide", "options": [{ "value": "hide", "label": "Ukryj" }, { "value": "show", "label": "Pokaz" }] },
    { "id": "order", "type": "enum", "role": "style", "label": "Kolejnosc", "description": "Wierszami albo fala.", "default": "rows", "options": [{ "value": "rows", "label": "Wierszami" }, { "value": "wave", "label": "Fala" }] },
    { "id": "fill_at", "type": "number", "role": "timing", "label": "Start zapalania", "description": "Sekundy od startu elementu.", "default": 0.7 },
    { "id": "fill", "type": "number", "role": "timing", "label": "Czas zapalania", "description": "Sekundy.", "default": 2.2 },
    { "id": "backdrop", "type": "enum", "role": "style", "label": "Tlo", "description": "Wlasne tlo albo przezroczyste.", "default": "solid", "options": [{ "value": "solid", "label": "Pelne" }, { "value": "none", "label": "Brak" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Dot Heatmap</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="dot-heatmap" data-duration="4.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #ffffff);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .dh-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .dh-clip.solid {
            background: var(--bg, #0f1012);
          }

          /* --u ustawia skrypt: 1cqw albo mniej, gdy siatka jest wysoka */
          .dh-stage {
            --u: 1cqw;
            width: calc(var(--u) * 88);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
          }

          .dh-label {
            height: calc(var(--u) * 6);
            font-size: calc(var(--u) * 4.6);
            font-weight: 600;
            line-height: calc(var(--u) * 6);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted, #898989);
            white-space: nowrap;
            opacity: 0;
          }

          .dh-label:empty {
            display: none;
          }

          .dh-value {
            height: calc(var(--u) * 20);
            font-size: calc(var(--u) * 17);
            font-weight: 800;
            line-height: calc(var(--u) * 20);
            letter-spacing: -0.05em;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            opacity: 0;
          }

          .dh-value small {
            font-size: 0.42em;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--muted, #898989);
            margin-left: 0.2em;
          }

          .dh-value small:empty {
            display: none;
          }

          .dh-grid {
            margin-top: calc(var(--u) * 4);
            width: 100%;
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            gap: calc(var(--u) * var(--gap));
          }

          .dh-cell {
            position: relative;
            aspect-ratio: 1;
            border-radius: 28%;
            background: color-mix(in srgb, var(--fg, #fff) 9%, transparent);
            opacity: 0;
          }

          .dh-cell i {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: var(--brand, #00e5a0);
            box-shadow: 0 0 calc(var(--u) * 2.2) color-mix(in srgb, var(--brand, #00e5a0) 45%, transparent);
            opacity: 0;
          }
        </style>

        <div id="dot-heatmap-clip" class="dh-clip clip" data-start="0" data-duration="4.5" data-track-index="0">
          <div class="dh-stage" role="img">
            <div class="dh-label"></div>
            <div class="dh-value"><span class="dh-num">0</span><small class="dh-tot"></small><small class="dh-suf"></small></div>
            <div class="dh-grid"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var q = function (sel) {
              return root.querySelector(sel);
            };
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (v) {
              return v == null ? "" : String(v).trim();
            };
            var num = function (v, d) {
              var n = Number(v);
              return v == null || v === "" || !Number.isFinite(n) ? d : n;
            };

            var cols = Math.max(1, Math.min(24, Math.round(num(vars.cols, 7))));
            var rows = Math.max(1, Math.min(12, Math.round(num(vars.rows, 5))));
            var cells = cols * rows;
            var pattern = str(vars.pattern).replace(/[^01]/g, "");
            var active = Math.round(num(vars.active, -1));
            var on = [];
            for (var c = 0; c < cells; c += 1) {
              on.push(pattern ? pattern.charAt(c) === "1" : active < 0 || c < active);
            }
            var FILL_AT = Math.max(0.3, num(vars.fill_at, 0.7));
            var FILL = Math.max(0.2, num(vars.fill, 2.2));
            var wave = vars.order === "wave";

            if ((vars.backdrop || "solid") !== "none") q(".dh-clip").classList.add("solid");
            q(".dh-label").textContent = str(vars.label);
            q(".dh-suf").textContent = str(vars.suffix);
            q(".dh-tot").textContent = vars.total === "show" ? "/ " + cells : "";

            // rozmiar: szerokosc sceny 88 u; wysokosc = naglowek + siatka. Gdy za wysoka, --u maleje.
            var gap = cols > 14 ? 0.9 : cols > 9 ? 1.4 : 2.2;
            var cell = (88 - (cols - 1) * gap) / cols;
            var totalU = (str(vars.label) ? 6 : 0) + 20 + 4 + rows * cell + (rows - 1) * gap;
            var stage = q(".dh-stage");
            stage.style.setProperty("--u", "min(1cqw, " + (88 / totalU).toFixed(4) + "cqh)");
            var grid = q(".dh-grid");
            grid.style.setProperty("--cols", String(cols));
            grid.style.setProperty("--gap", String(gap));

            var nodes = [];
            for (var k = 0; k < cells; k += 1) {
              var node = document.createElement("div");
              node.className = "dh-cell";
              node.innerHTML = "<i></i>";
              grid.appendChild(node);
              nodes.push(node);
            }

            // kolejnosc zapalania: wierszami albo po przekatnych (kolumna + wiersz)
            var order = [];
            for (var n = 0; n < cells; n += 1) if (on[n]) order.push(n);
            if (wave) {
              order.sort(function (a, b) {
                var da = (a % cols) + Math.floor(a / cols), db = (b % cols) + Math.floor(b / cols);
                return da - db || a - b;
              });
            }
            var count = order.length;

            var numEl = q(".dh-num");
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(q(".dh-label"), { opacity: 0, yPercent: 40 }, { opacity: 1, yPercent: 0, duration: 0.35, ease: "power3.out" }, 0);
            tl.fromTo(q(".dh-value"), { opacity: 0, yPercent: 14 }, { opacity: 1, yPercent: 0, duration: 0.45, ease: "expo.out" }, 0.06);
            // siatka wstaje fala od lewego gornego rogu
            nodes.forEach(function (node, idx) {
              var dist = (idx % cols) + Math.floor(idx / cols);
              tl.fromTo(node, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.12 + (dist / (cols + rows)) * 0.36);
            });
            // zapalanie: rowne odstepy, kazda kropka podskakuje, licznik rosnie o jeden
            order.forEach(function (idx, pos) {
              var at = FILL_AT + (count > 1 ? (FILL * pos) / (count - 1) : 0);
              tl.to(nodes[idx].querySelector("i"), { opacity: 1, duration: 0.12, ease: "power2.out" }, at);
              tl.fromTo(nodes[idx], { scale: 1.45 }, { scale: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, at);
              tl.set(numEl, { textContent: String(pos + 1) }, at);
            });
            var END = FILL_AT + FILL;
            if (count > 0) {
              tl.fromTo(q(".dh-value"), { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 60%", immediateRender: false }, END + 0.05);
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["dot-heatmap"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
