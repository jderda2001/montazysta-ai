<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter Tight", sans-serif; color: #fff; }
      .card { position: absolute; left: 120px; top: 160px; width: 560px; padding: 28px; border-radius: 28px; background: rgba(15,16,18,.86);
        border: 1.5px solid rgba(255,255,255,.12); box-shadow: 0 24px 70px rgba(0,0,0,.35); display: flex; gap: 22px; align-items: center; }
      .card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #ff7018; }
      .t1 { font-size: 40px; font-weight: 800; } .t2 { font-size: 26px; color: #a0a3aa; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="c1" class="card clip" data-start="0" data-duration="3" data-track-index="1">
        <img src="assets/kaja_avatar.png" alt=""><div><div class="t1">Kaja · Sprzedaż</div><div class="t2">Udostępniono zespołowi</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#c1",{opacity:0,x:-60,filter:"blur(12px)"},{opacity:1,x:0,filter:"blur(0px)",duration:0.5,ease:"power3.out"},0.1);
      tl.to("#c1",{opacity:0,x:-40,filter:"blur(10px)",duration:0.3,ease:"power2.in"},2.6);
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
    </script>
  </body>
</html>
